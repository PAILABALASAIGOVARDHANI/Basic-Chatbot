
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-container">
    <header class="chat-header">
      <div class="bot-avatar">🤖</div>
      <div class="header-info">
        <h2>Smart Chatbot</h2>
        <p><span class="online-dot"></span> Online</p>
      </div>
      <button id="clearBtn" class="clear-btn" title="Clear chat">
        ↻
      </button>
    </header>

    <main id="chatBox" class="chat-box">
      <div class="message bot-message">
        <div class="message-content">
          Hello! 👋 Welcome to Smart Chatbot.
          <br>How can I help you today?
        </div>
        <span class="time">Just now</span>
      </div>
    </main>

    <div class="suggestions">
      <button class="suggestion" data-message="What can you do?">
        What can you do?
      </button>
      <button class="suggestion" data-message="Tell me a joke">
        Tell me a joke
      </button>
      <button class="suggestion" data-message="Help">
        Help
      </button>
    </div>

    <form id="chatForm" class="chat-input">
      <input
        type="text"
        id="userInput"
        placeholder="Type your message..."
        autocomplete="off"
        required
      >
      <button type="submit" id="sendBtn" aria-label="Send message">
        ➤
      </button>
    </form>

    <footer>Powered by HTML, CSS & JavaScript</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
